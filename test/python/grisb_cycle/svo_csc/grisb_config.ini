[general]
seedname = svo
jobname = out
enforce_off_diag = True
block_threshold= 0.001
csc = True

solver_type = fci
norb_baths = 3

prec_mu = 0.001

h_int_type = kanamori
U = 0.0
J = 0.0

beta = 49
eta = 0.01
n_w = 1000
w_range = -10, 10

n_iter_grisb_first = 1
n_iter_grisb_per = 1
n_iter_grisb = 3

dc_type = 1
dc = True
dc_dmft = False

calc_energies = True
grisb_mix = 0.2
grisb_tol = 1e-5

h5_save_freq = 5

[solver]
measure_g_tau =True
measure_density_matrix = True

[dft]
dft_code = qe
n_cores = 1
mpi_env = default
projector_type = w90
dft_exec = pw.x
w90_tolerance = 1.e-1
